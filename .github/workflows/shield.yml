name: Build Mania Shield (Android 5.1 + Plus)

# Build personnel de Sonic Mania pour la Nvidia Shield Portable (Android 5.1, armeabi-v7a).
# - corrections Android 5.1 (musique sans thread asynchrone, liberation des references JNI)
# - Plus actif (build personnel, a utiliser avec sa propre copie de Sonic Mania Plus)
# Lancement : onglet Actions -> "Build Mania Shield" -> Run workflow

on:
  workflow_dispatch:

jobs:
  mania-shield:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RSDKv5
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checkout Sonic Mania
        uses: actions/checkout@v4
        with:
          repository: "RSDKModding/Sonic-Mania-Decompilation"
          path: "Sonic-Mania-Decompilation"
      - name: Correctifs Android 5.1
        shell: python3 {0}
        run: |
          def rep(path, old, new):
              s = open(path).read()
              if s.count(old) != 1:
                  raise SystemExit("motif introuvable dans " + path + " : " + old)
              open(path, "w").write(s.replace(old, new))
              print("OK", path)

          # 1) musique : chargement synchrone (evite un thread JNI jamais detache -> plantage ART Android 5)
          rep("RSDKv5/RSDK/Audio/Oboe/OboeAudioDevice.cpp",
              "pthread_create(&loadThread, NULL, LoadStreamASync, channel);",
              "(void)loadThread; LoadStream(channel); // Shield Android 5.1 : chargement synchrone")
          # 2) journal : liberer la reference JNI locale (table limitee a 512 avant Android 8)
          rep("RSDKv5/RSDK/Dev/Debug.cpp",
              "jni->env->CallVoidMethod(jni->thiz, writeLog, array, as);",
              "jni->env->CallVoidMethod(jni->thiz, writeLog, array, as); jni->env->DeleteLocalRef(array);")
          # 3) ouverture de fichiers
          rep("dependencies/android/androidHelpers.cpp",
              "int fd        = _jni_setup.env->CallIntMethod(_jni_setup.thiz, getFD, jpath, mode[0]);",
              "int fd        = _jni_setup.env->CallIntMethod(_jni_setup.thiz, getFD, jpath, mode[0]); _jni_setup.env->DeleteLocalRef(jpath);")
          # 4) fonctions fichiers des mods
          rep("RSDKv5/RSDK/Core/ModAPI.cpp",
              "return jni->env->CallBooleanMethod(jni->thiz, fsExists, array);",
              "bool r = jni->env->CallBooleanMethod(jni->thiz, fsExists, array); jni->env->DeleteLocalRef(array); return r;")
          rep("RSDKv5/RSDK/Core/ModAPI.cpp",
              "return jni->env->CallBooleanMethod(jni->thiz, fsIsDir, array);",
              "bool r = jni->env->CallBooleanMethod(jni->thiz, fsIsDir, array); jni->env->DeleteLocalRef(array); return r;")
      - name: Setup RSDKv5 dependencies
        working-directory: ./dependencies/android
        run: |
          curl -L -O https://downloads.xiph.org/releases/ogg/libogg-1.3.5.zip
          curl -L -O https://downloads.xiph.org/releases/theora/libtheora-1.1.1.zip
          unzip \*.zip
          rm *.zip
          rsync -ar libogg-*/* libogg
          mv libtheora-* libtheora
      - name: Setup symlinks
        run: |
          rm Game
          rmdir $PWD/Sonic-Mania-Decompilation/dependencies/RSDKv5
          ln -s $PWD $PWD/Sonic-Mania-Decompilation/dependencies/RSDKv5
          ln -s $PWD/Sonic-Mania-Decompilation ./android/app/jni/Game
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Android SDK / NDK (SDK deja present sur le runner)
        run: |
          set +o pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          yes | "$SDKM" "ndk;24.0.8215888" "platforms;android-33" > /dev/null || true
          test -d "$ANDROID_HOME/ndk/24.0.8215888" && echo "NDK OK"
      - name: Build (armeabi-v7a, RSDKv5 rev 2, Plus actif)
        working-directory: ./android
        run: |
          ./gradlew assemble --no-daemon -PABIFILTERS="armeabi-v7a" -PRETRO_REVISION=2
          mkdir -p ../artifacts
          mv app/build/outputs/apk/release/*.apk ../artifacts/rsdkv5_mania_shield.apk
      - name: Cleanup
        run: rm $PWD/Sonic-Mania-Decompilation/dependencies/RSDKv5
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mania-shield
          path: artifacts
